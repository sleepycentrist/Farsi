<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verb Practice</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png">
  </head>

  <body>
    <main>
      <a href="index.html">← Home</a>

      <h1>Verb practice</h1>

      <div class="sentence-controls">
        <label for="verb-select">Verb</label>
        <select id="verb-select" disabled><option value="all">All verbs</option></select>
        <label for="tense-select">Form</label>
        <select id="tense-select" disabled>
          <option value="all">All forms</option>
          <option value="present">Present</option>
          <option value="presentContinuous">Present continuous</option>
          <option value="past">Simple past</option>
          <option value="pastContinuous">Past continuous</option>
          <option value="future">Future</option>
          <option value="must">Must / have to</option>
        </select>
      </div>
      <p id="verb-progress" aria-live="polite"></p>
      <h2 id="verb-cue">Loading verbs…</h2>
      <p id="verb-person"></p>
      <p id="verb-form"></p>
      <p>Choose the matching verb form.</p>
      <div id="verb-options" class="word-tiles"></div>
      <div class="sentence-controls">
        <button id="next-verb" disabled>Next question</button>
        <button id="shuffle-verbs" disabled>Shuffle practice</button>
      </div>

      <p id="verb-feedback" aria-live="polite"></p>
    </main>

    <script src="utils.js"></script>
    <script src="verbs.js?v=20261004"></script>
  </body>
</html>
